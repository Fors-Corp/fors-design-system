version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # PRODUCTION dependency: all 15 @radix-ui/react-* entries live under
      # "dependencies" in package.json (verified 2026-09-09), not
      # "peerDependencies"/"devDependencies" like everything else grouped here.
      # See the matching entry in `ignore` below — majors are excluded the
      # same way tailwindcss/vite/react/react-dom are.
      radix:
        patterns:
          - "@radix-ui/*"

      # Verified against the real package.json (2026-10-02). The Storybook-9/
      # vitest-addon migration HAS now landed (storybook 10.6.x), so the old
      # Storybook-8 list here was stale: @storybook/addon-essentials,
      # @storybook/test and @storybook/test-runner no longer exist in this
      # repo, while @storybook/addon-docs and @storybook/addon-vitest do and
      # were missing. That omission is what stranded the vitest group for
      # three weeks: Dependabot bumped vitest to 5.0.1 while leaving
      # @storybook/addon-vitest at 10.6.0, whose @vitest/browser peer capped
      # at ^4 — an ERESOLVE that no peer bump inside the group could fix
      # (see PR #46). These must move in lockstep.
      storybook:
        patterns:
          - "storybook"
          - "@storybook/addon-a11y"
          - "@storybook/addon-docs"
          - "@storybook/addon-vitest"
          - "@storybook/react"
          - "@storybook/react-vite"

      eslint:
        patterns:
          - "eslint"
          - "@eslint/js"
          - "typescript-eslint"
          - "eslint-plugin-*"
          - "eslint-config-prettier"

      # All five are real devDependencies (verified 2026-10-02). The older
      # note here claiming @vitest/browser is "intentionally omitted" was
      # stale — it is both a dependency and listed below.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/coverage-v8"
          - "@vitest/browser"
          - "@vitest/browser-playwright"
          - "vitest-axe"

      # @tailwindcss/postcss pins an exact tailwindcss version as its own
      # dependency, so the two must move in lockstep — bumped apart, the
      # build plugin and the root tailwindcss would compile with different
      # versions.
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"

      vite:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"

      size-limit:
        patterns:
          - "size-limit"
          - "@size-limit/preset-small-lib"

      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    ignore:
      # Major bumps for these need a deliberate migration pass (breaking
      # config/API changes), not an automated PR — patch/minor still flow through.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tailwindcss/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      # @vitejs/plugin-react's major tracks vite's major (grouped above) —
      # PR #25 hit this: Dependabot proposed the plugin's major alone
      # (peer-requiring vite ^8, which vite's own ignore rule above blocks
      # from ever being proposed), an unmergeable combination.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      # radix is a PRODUCTION dependency (see the `radix` group above) —
      # same major-bump treatment as the others in this list.
      - dependency-name: "@radix-ui/*"
        update-types: ["version-update:semver-major"]
      # Every other production ("dependencies", not "devDependencies") package
      # gets the same treatment — a major bump here changes what every
      # consumer of this published package must satisfy, so it needs a
      # deliberate migration pass, not an automated PR. (The auto-merge
      # workflow's own runtime gate blocks major bumps regardless of this
      # list, but leaving these off meant Dependabot would still open —
      # and pile up — major-bump PRs for them with no automation to close
      # or triage the pile.)
      - dependency-name: "class-variance-authority"
        update-types: ["version-update:semver-major"]
      - dependency-name: "clsx"
        update-types: ["version-update:semver-major"]
      - dependency-name: "cmdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-day-picker"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwind-merge"
        update-types: ["version-update:semver-major"]
      # typescript majors are gated on the lint toolchain, not on this repo:
      # typescript-eslint@8.71.0 (latest, no newer tag) peers
      # `typescript >=4.8.4 <6.1.0`, so TS 7 cannot install alongside it.
      # Dependabot raised this twice — #47 merged with the bump reverted, and
      # #70 re-raised the identical unmergeable change. Revisit when
      # typescript-eslint ships a TS-7 peer range.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
